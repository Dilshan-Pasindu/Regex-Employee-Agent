name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. Rust MCP Client & Deterministic Intent Engine
  # ---------------------------------------------------------------------------
  rust-tests:
    name: Rust Client Tests & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo Dependencies & Build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust-client/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-client/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Rust Check
        run: cargo check --manifest-path rust-client/Cargo.toml

      - name: Run 85 Automated Unit & Integration Tests
        run: cargo test --manifest-path rust-client/Cargo.toml -- --nocapture

      - name: Check Formatting
        run: cargo fmt --manifest-path rust-client/Cargo.toml -- --check

  # ---------------------------------------------------------------------------
  # 2. .NET 8 MCP Server
  # ---------------------------------------------------------------------------
  dotnet-build:
    name: .NET 8 MCP Server Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore dotnet-mcp-server/EmployeeMcpServer/EmployeeMcpServer.csproj

      - name: Build MCP Server (Release)
        run: dotnet build --configuration Release --no-restore dotnet-mcp-server/EmployeeMcpServer/EmployeeMcpServer.csproj

  # ---------------------------------------------------------------------------
  # 3. React Vite TypeScript Frontend
  # ---------------------------------------------------------------------------
  frontend-build:
    name: React Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci --prefix frontend

      - name: Verify TypeScript & Build Vite Production Bundle
        run: npm run build --prefix frontend

  # ---------------------------------------------------------------------------
  # 4. Python FastAPI Gateway Service
  # ---------------------------------------------------------------------------
  python-checks:
    name: Python FastAPI Gateway Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Syntax and Bytecode Compilation Check
        run: python -m compileall backend/

  # ---------------------------------------------------------------------------
  # 5. Pipeline Gate (Unified Status Check for PRs)
  # ---------------------------------------------------------------------------
  ci-status-gate:
    name: CI Pipeline Status Gate
    needs: [rust-tests, dotnet-build, frontend-build, python-checks]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check Status of All Jobs
        run: |
          if [ "${{ needs.rust-tests.result }}" != "success" ] || \
             [ "${{ needs.dotnet-build.result }}" != "success" ] || \
             [ "${{ needs.frontend-build.result }}" != "success" ] || \
             [ "${{ needs.python-checks.result }}" != "success" ]; then
            echo "❌ One or more CI jobs failed."
            exit 1
          fi
          echo "✅ All CI checks passed successfully."
