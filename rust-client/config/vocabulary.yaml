# -----------------------------------------------------------------------------
# Status Value Normalisation
# Maps slang/synonyms to database values: "Active", "Inactive", "On Leave"
# -----------------------------------------------------------------------------
status_mappings:
  Active:
    - "active"
    - "enabled"
    - "working"
    - "current"
    - "employed"
  Inactive:
    - "inactive"
    - "disabled"
    - "terminated"
    - "left"
    - "resigned"
    - "fired"
  "On Leave":
    - "on leave"
    - "leave"
    - "absent"
    - "vacation"
    - "holiday"
