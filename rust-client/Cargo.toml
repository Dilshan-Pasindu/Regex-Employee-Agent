[package]
name = "employee-mcp-client"
version = "0.1.0"
edition = "2024"
description = "MCP Client for the Employee Management System — deterministic Regex intent detection, no LLM"

[dependencies]
tokio        = { version = "1", features = ["full"] }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
regex        = "1"
once_cell    = "1"
anyhow       = "1"
thiserror    = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP server layer (Phase 3 — Axum)
axum         = { version = "0.7", features = ["json"] }
tower-http   = { version = "0.5", features = ["cors"] }

[profile.release]
opt-level = 3
